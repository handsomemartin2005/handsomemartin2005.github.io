type = "card"
title = "能源科研项目"

[[items]]
title = "考虑多维气象指标的河南省代理购电电量分析预测"
content = "参与用电与气象数据清洗和时序对齐，调研代理购电流程，参与气象特征构建、代理购电负荷预测和异常负荷归因。"

[[items]]
title = "支撑电力中长期与现货市场衔接的带曲线交易关键技术研究"
content = "参与交易曲线预测工作，整理优先发电与优先购电曲线的时序建模输入，研究两类曲线不匹配对市场化交易空间预测的影响。"

[[items]]
title = "基于人工智能的辽宁电力市场运营智能决策关键技术研究与应用"
content = "参与项目可行性研究，梳理电力市场运行边界的多时间尺度预测、发电企业报价辅助决策、市场出清分析及风险预警方案。"

[[items]]
title = "基于 AI 驱动的智能充电站动态分级管理关键技术研究"
content = "参与充电需求时空预测和电网约束下的充电协同研究，梳理如何根据需求预测结果对站点运行状态动态分级并支持运营决策。"

[[items]]
title = "基于大模型的电力计量系统可靠性及智能运维优化策略研究"
content = "开发电表面板检测与文字识别流程，参与构建设备故障知识图谱和诊断工具，支持故障分析与运维决策。"
