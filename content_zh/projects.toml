link = "https://github.com/handsomemartin2005/YOLO-ARC"

[[items]]
title = "HGDefect-YOLO · 工业缺陷检测"
subtitle = "计算机视觉"
content = "开发面向低对比度、不规则表面缺陷的轻量化检测模型。在 NEU-DET 上取得 79.9% AP50 和 45.9% AP50:95，模型参数量为 562 万。"

[[items]]
title = "SCH-MDETR · 微型无人机检测"
subtitle = "计算机视觉"
content = "研究可见光图像中的小目标检测。在 Det-Fly 验证集上取得 87.37% mAP50 和 51.60% mAP50–95，较 RT-DETR-R18-N 的 mAP50–95 提升 1.72 个百分点。"
link = "https://github.com/handsomemartin2005/ACCV2026"

[[items]]
