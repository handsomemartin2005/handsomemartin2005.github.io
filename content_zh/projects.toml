type = "card"
title = "科研与工程项目"

[[items]]
id = "agent-security"
title = "The Secret Was Never in the Call"
subtitle = "大语言模型智能体安全 · 进行中"
content = "研究智能体工具调用中可见的请求与工具实际行为之间的差异，通过受控评估分析数据暴露与授权风险，为改进审计提供依据。"

[[items]]
title = "VLA · 语言条件下的无人机控制"
subtitle = "视觉–语言–动作模型 · 初稿"
link = "/publications/#zhang-uav-residual-adaptation"
link_label = "查看论文初稿"
content = "研究面向无人机导航的视觉–语言–动作模型高效适配。在导航基准上评估空间信息和运动历史对动作预测的影响。"

[[items]]
title = "RMPF-Orion · 代理购电负荷预测"
subtitle = "多模态预测 · 进行中"
content = "研究用于代理购电负荷预测的鲁棒时序模型。项目延续了交易曲线预测工作，融合负荷、气象、文本和事件信息，并结合大模型辅助分析与 SHAP 解释异常负荷。"

[[items]]
title = "Atlas · 仓库级大语言模型集成研究"
subtitle = "实证软件工程"
content = "综合源码、依赖、配置、项目文档和开发历史，识别开源项目集成大语言模型的方式。建立了包含 200 个仓库的评测基准，分析 12,991 个活跃 GitHub 仓库，识别出 1,036 个集成大语言模型的项目。评估中的仓库识别 F1 为 89.11%，加载模式识别 F1 为 84.97%。研究对发现的安全与许可证合规问题进行了负责任披露。"

[[items]]
title = "ReLiEF-HGDiff · 流感预警"
subtitle = "多模态预测"
content = "开发州级流感预测流程，在评估中考虑公共卫生监测及其他信号的实际发布时间，并按当时可获得的信息回测流感高峰预警性能。"
link = "https://github.com/handsomemartin2005/RELIEF-HGDiff"

[[items]]
title = "RIGOR-OMR · 零样本跨领域光学乐谱识别"
subtitle = "光学乐谱识别"
content = "利用谱线归一化后的几何信息指导视觉符号检测与显式关系推理，无需在目标域训练或针对特定数据集适配，即可重建结构化乐谱。采用音高—时值事件协议评估跨领域识别效果。StaffOMR 是早期规则基线。"
link = "https://github.com/handsomemartin2005/StaffOMR"
link_label = "GitHub · StaffOMR 基线"

[[items]]
title = "电力计量可靠性与智能运维"
subtitle = "电力系统 · 计算机视觉"
content = "开发电表面板检测和文字识别流程，参与 PowerKG 知识图谱与 MeterAgent 故障诊断。"
link = "https://github.com/handsomemartin2005/YOLOv8_sensor"
link_label = "GitHub · 电表检测与文字识别"

[[items]]
title = "YOLO-ARC · 工业表面检测"
subtitle = "计算机视觉 · ICPECA 2026"
