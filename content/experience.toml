content = """
- Aligned public health surveillance, Google Trends, weather, hospitalization, wastewater, and calendar signals into state-week panels for 1–8-week influenza-like illness (ILI) forecasts and surge warnings.
- Designed ReLiEF-HGDiff to account for when inputs become available and evaluated it against statistical and machine-learning baselines using only data available at each forecast date.
